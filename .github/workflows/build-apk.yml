name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    paths:
      - "flutter_template/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter_template
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name governor_studio_app .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload real APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-flutter-studio-apk
          path: flutter_template/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
